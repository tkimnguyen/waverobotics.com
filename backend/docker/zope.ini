# zope.ini of plone/server-prod-config 6.2.3, plus file copies of both logs.
#
# The image logs only to stdout/stderr, which Docker keeps in a 50 MB ring
# (about 5 days here) and drops when the container is recreated. The two
# *file handlers below also write the access log and the event log to
# /data/log (the instance's var/log on the host), where logrotate keeps 4
# weeks. Everything else is unchanged from the image.

[app:zope]
use = egg:Zope#main
zope_conf = %(here)s/%(config_file)s

[server:main]
use = egg:waitress#main
host = 0.0.0.0
port = 8080
threads = 2
clear_untrusted_proxy_headers = false
max_request_body_size = 1073741824


[filter:translogger]
use = egg:Paste#translogger
setup_console_handler = False

[pipeline:main]
pipeline =
    egg:Zope#httpexceptions
    translogger
    zope

[loggers]
keys = root, waitress.queue, waitress, wsgi

[handlers]
keys = accesslog, eventlog, accessfile, eventfile

[formatters]
keys = generic, message

[formatter_generic]
format = %(asctime)s %(levelname)s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[formatter_message]
format = %(message)s

[logger_root]
level = INFO
handlers = eventlog, eventfile

[logger_waitress.queue]
level = INFO
handlers = eventlog, eventfile
qualname = waitress.queue
propagate = 0

[logger_waitress]
level = INFO
handlers = eventlog, eventfile
qualname = waitress
propagate = 0

[logger_wsgi]
level = WARN
handlers = accesslog, accessfile
qualname = wsgi
propagate = 0

[handler_accesslog]
class = StreamHandler
args = (sys.stdout,)
level = INFO
formatter = message

[handler_eventlog]
class = StreamHandler
args = (sys.stderr,)
level = INFO
formatter = generic

# Append mode, so logrotate's copytruncate works with the file kept open.
[handler_accessfile]
class = FileHandler
args = ('/data/log/instance-access.log', 'a')
level = INFO
formatter = message

[handler_eventfile]
class = FileHandler
args = ('/data/log/instance.log', 'a')
level = INFO
formatter = generic
